{{- /*
  Mermaid shortcode.
  Usage:
    {{< mermaid >}}
    graph TD
      A --> B
    {{< /mermaid >}}
  Loads Mermaid from CDN once per page (idempotent).
*/ -}}
<pre class="mermaid">
{{- .Inner | safeHTML -}}
</pre>
{{- if not (.Page.Scratch.Get "mermaid_loaded") -}}
  {{- .Page.Scratch.Set "mermaid_loaded" true -}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  const theme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'default';
  mermaid.initialize({ startOnLoad: true, theme, securityLevel: 'loose', flowchart: { curve: 'basis' } });
</script>
{{- end -}}
